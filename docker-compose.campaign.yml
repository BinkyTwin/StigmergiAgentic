version: "3.8"

services:
  # ---- Campagne Qwen (modèle par défaut, clé .env) ----
  qwen-campaign:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-qwen
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      ADAPT_START: ${ADAPT_START:-0}
      ADAPT_QUERIES: ${ADAPT_QUERIES:-90}
      EVAL_START: ${EVAL_START:-90}
      EVAL_QUERIES: ${EVAL_QUERIES:-90}
    volumes:
      # Résultats persistés sur le host
      - ./campaign_results/qwen:/app/campaign_results
      # DB de session isolée
      - ./campaign_results/qwen/pheromones:/app/pheromones
      # Configs (read-only)
      - ./config:/app/config:ro
      # Scripts
      - ./scripts:/app/scripts:ro
      # Code source (read-only, pour ne pas rebuild l'image)
      - ./core:/app/core:ro
      - ./adapters:/app/adapters:ro
      - ./tools:/app/tools:ro
      - ./llm:/app/llm:ro
      - ./main.py:/app/main.py:ro
    working_dir: /app
    command: >
      bash -c "
        echo '========================================' &&
        echo '  CAMPAGNE QWEN 3.5 9B' &&
        echo '========================================' &&
        mkdir -p campaign_results/adapt &&
        mkdir -p campaign_results/c2 &&
        mkdir -p campaign_results/c3 &&
        mkdir -p campaign_results/baseline &&
        bash scripts/run_qwen_campaign_docker.sh
      "

  # ---- Campagne Gemma (google/gemma-4-31b-it, clé .env.key2) ----
  gemma-campaign:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-gemma
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_2}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      ADAPT_START: ${ADAPT_START:-0}
      ADAPT_QUERIES: ${ADAPT_QUERIES:-90}
      EVAL_START: ${EVAL_START:-90}
      EVAL_QUERIES: ${EVAL_QUERIES:-90}
    volumes:
      - ./campaign_results/gemma:/app/campaign_results
      - ./campaign_results/gemma/pheromones:/app/pheromones
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./core:/app/core:ro
      - ./adapters:/app/adapters:ro
      - ./tools:/app/tools:ro
      - ./llm:/app/llm:ro
      - ./main.py:/app/main.py:ro
    working_dir: /app
    command: >
      bash -c "
        echo '========================================' &&
        echo '  CAMPAGNE GEMMA 4 31B' &&
        echo '========================================' &&
        mkdir -p campaign_results/adapt &&
        mkdir -p campaign_results/c2 &&
        mkdir -p campaign_results/c3 &&
        mkdir -p campaign_results/baseline &&
        bash scripts/run_gemma_campaign_docker.sh
      "

  # ---- Campagne scientifique finale — stigmergie C3 sous Gemma (clé OPENROUTER_API_KEY) ----
  gemma-stigmergie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-gemma-stigmergie
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      ADAPT_START: ${ADAPT_START:-0}
      ADAPT_QUERIES: ${ADAPT_QUERIES:-45}
      EVAL_START: ${EVAL_START:-0}
      EVAL_QUERIES: ${EVAL_QUERIES:-180}
      CLEAN_RESULTS: ${CLEAN_RESULTS:-true}
    volumes:
      - ./campaign_results/gemma-stigmergie:/app/campaign_results
      - ./campaign_results/gemma-stigmergie/pheromones:/app/pheromones
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./core:/app/core:ro
      - ./adapters:/app/adapters:ro
      - ./tools:/app/tools:ro
      - ./llm:/app/llm:ro
      - ./main.py:/app/main.py:ro
    working_dir: /app
    command: >
      bash -c "
        echo '========================================' &&
        echo '  CAMPAGNE GEMMA × STIGMERGIE C3' &&
        echo '========================================' &&
        mkdir -p campaign_results/adapt &&
        mkdir -p campaign_results/c3 &&
        bash scripts/run_gemma_stigmergie_c3_docker.sh
      "

  # ---- Campagne scientifique finale — baselines Gemma (clé OPENROUTER_API_KEY_2) ----
  gemma-baselines:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-gemma-baselines
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY_2}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      EVAL_START: ${EVAL_START:-0}
      EVAL_QUERIES: ${EVAL_QUERIES:-180}
      BASELINE_CONFIG: ${BASELINE_CONFIG:-config/travelplanner_eval_baseline_gemma.yaml}
      CLEAN_RESULTS: ${CLEAN_RESULTS:-true}
    volumes:
      - ./campaign_results/gemma-baselines:/app/campaign_results
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./core:/app/core:ro
      - ./adapters:/app/adapters:ro
      - ./tools:/app/tools:ro
      - ./llm:/app/llm:ro
      - ./main.py:/app/main.py:ro
    working_dir: /app
    command: >
      bash -c "
        echo '========================================' &&
        echo '  CAMPAGNE BASELINES × GEMMA' &&
        echo '========================================' &&
        mkdir -p campaign_results/solo_direct campaign_results/solo_cot campaign_results/solo_self_refine &&
        mkdir -p campaign_results/planner_executor campaign_results/metagpt_sequential campaign_results/langgraph_supervisor &&
        bash scripts/run_gemma_baselines_docker.sh
      "

  # ---- Campagne scientifique finale — stigmergie C3 sous DeepSeek V3 (clé DEEPSEEK_API_KEY) ----
  deepseek-stigmergie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-deepseek-stigmergie
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      ADAPT_START: ${ADAPT_START:-0}
      ADAPT_QUERIES: ${ADAPT_QUERIES:-45}
      EVAL_START: ${EVAL_START:-0}
      EVAL_QUERIES: ${EVAL_QUERIES:-180}
      CLEAN_RESULTS: ${CLEAN_RESULTS:-true}
    volumes:
      - ./campaign_results/deepseek-stigmergie:/app/campaign_results
      - ./campaign_results/deepseek-stigmergie/pheromones:/app/pheromones
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./core:/app/core:ro
      - ./adapters:/app/adapters:ro
      - ./tools:/app/tools:ro
      - ./llm:/app/llm:ro
      - ./main.py:/app/main.py:ro
    working_dir: /app
    command: >
      bash -c "
        echo '========================================' &&
        echo '  CAMPAGNE DEEPSEEK × STIGMERGIE C3' &&
        echo '========================================' &&
        mkdir -p campaign_results/adapt &&
        mkdir -p campaign_results/c3 &&
        bash scripts/run_deepseek_stigmergie_docker.sh
      "

  # ---- MigrationBench official preflight (before adapter claims) ----
  migrationbench-preflight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-migrationbench-preflight
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      MIGRATION_SUBSET: ${MIGRATION_SUBSET:-fixtures/migrationbench/subsets/smoke_5.jsonl}
      PREFLIGHT_LIMIT: ${PREFLIGHT_LIMIT:-5}
    volumes:
      - ./campaign_results/migrationbench-preflight:/app/campaign_results
      - ./workspaces/migrationbench-preflight:/app/workspaces
      - ./external:/app/external
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        /opt/venv/bin/python scripts/run_migrationbench_official_preflight.py \
          --subset "$${MIGRATION_SUBSET}" \
          --out-dir campaign_results/preflight \
          --migrationbench-root external/MigrationBench \
          --workspace-root workspaces/preflight \
          --limit "$${PREFLIGHT_LIMIT}" \
          --force

  # ---- MigrationBench V6 static / baseline campaign ----
  migrationbench-campaign:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-migrationbench-campaign
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      MIGRATION_SUBSET: ${MIGRATION_SUBSET:-fixtures/migrationbench/subsets/main_30.jsonl}
      MIGRATION_FRAMEWORKS: ${MIGRATION_FRAMEWORKS:-no_change dependency_only_script solo_direct planner_executor agentless_self_debug stigmergic_v6_static}
      MIGRATION_CONFIG: ${MIGRATION_CONFIG:-config/migrationbench_v6_static_deepseek.yaml}
      MIGRATION_SEED: ${MIGRATION_SEED:-42}
      MIGRATION_OUT_DIR: ${MIGRATION_OUT_DIR:-campaign_results/main}
      MIGRATION_FORCE: ${MIGRATION_FORCE:-true}
      MIGRATION_QUERY_TIMEOUT_SECONDS: ${MIGRATION_QUERY_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./campaign_results/migrationbench:/app/campaign_results
      - ./workspaces/migrationbench:/app/workspaces
      - ./external:/app/external
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        FORCE_ARGS=""
        if [ "$${MIGRATION_FORCE}" = "true" ]; then
          FORCE_ARGS="--force"
        fi
        /opt/venv/bin/python scripts/run_migrationbench_campaign.py \
          --subset "$${MIGRATION_SUBSET}" \
          --out-dir "$${MIGRATION_OUT_DIR}" \
          --config "$${MIGRATION_CONFIG}" \
          --seed "$${MIGRATION_SEED}" \
          --query-timeout-seconds "$${MIGRATION_QUERY_TIMEOUT_SECONDS}" \
          $${FORCE_ARGS} \
          --frameworks $${MIGRATION_FRAMEWORKS}

  # ---- MigrationBench V10 smoke (Phase 4 / Iteration L6) ----
  migrationbench-v10-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-migrationbench-v10-smoke
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      MIGRATION_SUBSET: ${MIGRATION_SUBSET:-fixtures/migrationbench/subsets/smoke_5.jsonl}
      MIGRATION_OUT_DIR: ${MIGRATION_OUT_DIR:-campaign_results/v10/migrationbench_smoke}
      MIGRATION_STRATEGY: ${MIGRATION_STRATEGY:-branching_repair}
      MIGRATION_SEED: ${MIGRATION_SEED:-42}
      MIGRATION_MAX_CANDIDATES: ${MIGRATION_MAX_CANDIDATES:-1}
      MIGRATION_MAX_REPAIR_ROUNDS: ${MIGRATION_MAX_REPAIR_ROUNDS:-0}
      MIGRATION_OFFICIAL_EVAL: ${MIGRATION_OFFICIAL_EVAL:-true}
      MIGRATION_OFFICIAL_TIMEOUT_SECONDS: ${MIGRATION_OFFICIAL_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./campaign_results/v10:/app/campaign_results/v10
      - ./workspaces/migrationbench_v10:/app/workspaces/migrationbench_v10
      - ./external:/app/external
    working_dir: /app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        EXTRAS=$$(python -c 'import json,os; print(json.dumps({"workspace_root_root":"workspaces/migrationbench_v10","artifacts_root":os.environ["MIGRATION_OUT_DIR"]+"/artifacts","migrationbench_root":"external/MigrationBench","official_eval":os.environ["MIGRATION_OFFICIAL_EVAL"].lower()=="true","official_timeout_seconds":float(os.environ["MIGRATION_OFFICIAL_TIMEOUT_SECONDS"]),"prepare":True,"out_dir":os.environ["MIGRATION_OUT_DIR"]}))')
        /opt/venv/bin/python -m scripts.bench.harness \
          --adapter migrationbench \
          --strategy "$${MIGRATION_STRATEGY}" \
          --subset "$${MIGRATION_SUBSET}" \
          --out-dir "$${MIGRATION_OUT_DIR}" \
          --seed "$${MIGRATION_SEED}" \
          --max-candidates "$${MIGRATION_MAX_CANDIDATES}" \
          --max-repair-rounds "$${MIGRATION_MAX_REPAIR_ROUNDS}" \
          --extras "$${EXTRAS}"

  # ---- V11 causal medium smoke (toy by default, optional MigrationBench) ----
  v11-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-v11-smoke
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      V11_OUT_DIR: ${V11_OUT_DIR:-campaign_results/v11/smoke}
      V11_MIGRATION_SUBSET: ${V11_MIGRATION_SUBSET:-}
      V11_MIGRATION_LIMIT: ${V11_MIGRATION_LIMIT:-}
      V11_OFFICIAL_EVAL: ${V11_OFFICIAL_EVAL:-false}
    volumes:
      - ./campaign_results/v11:/app/campaign_results/v11
      - ./workspaces/migrationbench_v11:/app/workspaces/migrationbench_v11
      - ./external:/app/external
    working_dir: /app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    command:
      - bash
      - -lc
      - |
        set -e
        ARGS="--out-dir $${V11_OUT_DIR}"
        if [ -n "$${V11_MIGRATION_SUBSET}" ]; then
          if [ ! -d external/MigrationBench/.git ]; then
            mkdir -p external
            git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
          fi
          ARGS="$${ARGS} --migrationbench-subset $${V11_MIGRATION_SUBSET}"
          if [ -n "$${V11_MIGRATION_LIMIT}" ]; then
            ARGS="$${ARGS} --migrationbench-limit $${V11_MIGRATION_LIMIT}"
          fi
          if [ "$${V11_OFFICIAL_EVAL}" = "true" ]; then
            ARGS="$${ARGS} --official-eval"
          fi
        fi
        /opt/venv/bin/python -m scripts.v11.run_v11_smoke $${ARGS}

  # ---- V11 MigrationBench controlled smoke (B2/B5/B6, replay-gated) ----
  v11-migrationbench-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-v11-migrationbench-smoke
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      V11_MIGRATION_SUBSET: ${V11_MIGRATION_SUBSET:-fixtures/migrationbench/subsets/smoke_5.jsonl}
      V11_MIGRATION_LIMIT: ${V11_MIGRATION_LIMIT:-2}
      V11_OUT_DIR: ${V11_OUT_DIR:-campaign_results/v11/migrationbench_smoke}
      V11_WORKSPACE_ROOT: ${V11_WORKSPACE_ROOT:-workspaces/migrationbench_v11}
      V11_SEED: ${V11_SEED:-42}
      V11_OFFICIAL_EVAL: ${V11_OFFICIAL_EVAL:-false}
      V11_USE_LLM_PROVIDERS: ${V11_USE_LLM_PROVIDERS:-false}
      V11_OFFICIAL_TIMEOUT_SECONDS: ${V11_OFFICIAL_TIMEOUT_SECONDS:-1800}
      V11_LLM_INITIAL_CANDIDATES: ${V11_LLM_INITIAL_CANDIDATES:-2}
      V11_LLM_REPAIR_CANDIDATES: ${V11_LLM_REPAIR_CANDIDATES:-2}
      V11_B6_FALLBACK_POLICY: ${V11_B6_FALLBACK_POLICY:-guarded_only}
      V11_MAX_CANDIDATES: ${V11_MAX_CANDIDATES:-2}
      V11_MAX_REPAIR_ROUNDS: ${V11_MAX_REPAIR_ROUNDS:-1}
      V11_MAX_REPAIRS_PER_CANDIDATE: ${V11_MAX_REPAIRS_PER_CANDIDATE:-2}
    volumes:
      - ./campaign_results/v11:/app/campaign_results/v11
      - ./workspaces/migrationbench_v11:/app/workspaces/migrationbench_v11
      - ./external:/app/external
    working_dir: /app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        ARGS="--subset $${V11_MIGRATION_SUBSET} --out-dir $${V11_OUT_DIR} --workspace-root $${V11_WORKSPACE_ROOT} --migrationbench-root external/MigrationBench --seed $${V11_SEED} --official-timeout-seconds $${V11_OFFICIAL_TIMEOUT_SECONDS} --llm-initial-candidates $${V11_LLM_INITIAL_CANDIDATES} --llm-repair-candidates $${V11_LLM_REPAIR_CANDIDATES} --b6-fallback-policy $${V11_B6_FALLBACK_POLICY} --max-candidates $${V11_MAX_CANDIDATES} --max-repair-rounds $${V11_MAX_REPAIR_ROUNDS} --max-repairs-per-candidate $${V11_MAX_REPAIRS_PER_CANDIDATE}"
        if [ -n "$${V11_MIGRATION_LIMIT}" ]; then
          ARGS="$${ARGS} --limit $${V11_MIGRATION_LIMIT}"
        fi
        if [ "$${V11_OFFICIAL_EVAL}" = "true" ]; then
          ARGS="$${ARGS} --official-eval"
        fi
        if [ "$${V11_USE_LLM_PROVIDERS}" = "true" ]; then
          ARGS="$${ARGS} --use-llm-providers"
        fi
        /opt/venv/bin/python -m scripts.v11.run_v11_migrationbench_campaign $${ARGS}

  # ---- V11 MigrationBench main_30 launch path (B2/B5/B6) ----
  v11-migrationbench-main30:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-v11-migrationbench-main30
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      V11_MIGRATION_SUBSET: ${V11_MIGRATION_SUBSET:-fixtures/migrationbench/subsets/main_30.jsonl}
      V11_MIGRATION_LIMIT: ${V11_MIGRATION_LIMIT:-}
      V11_OUT_DIR: ${V11_OUT_DIR:-campaign_results/v11/migrationbench_main30}
      V11_WORKSPACE_ROOT: ${V11_WORKSPACE_ROOT:-workspaces/migrationbench_v11}
      V11_SEED: ${V11_SEED:-42}
      V11_OFFICIAL_EVAL: ${V11_OFFICIAL_EVAL:-true}
      V11_USE_LLM_PROVIDERS: ${V11_USE_LLM_PROVIDERS:-true}
      V11_OFFICIAL_TIMEOUT_SECONDS: ${V11_OFFICIAL_TIMEOUT_SECONDS:-1800}
      V11_LLM_INITIAL_CANDIDATES: ${V11_LLM_INITIAL_CANDIDATES:-2}
      V11_LLM_REPAIR_CANDIDATES: ${V11_LLM_REPAIR_CANDIDATES:-2}
      V11_B6_FALLBACK_POLICY: ${V11_B6_FALLBACK_POLICY:-guarded_only}
      V11_MAX_CANDIDATES: ${V11_MAX_CANDIDATES:-2}
      V11_MAX_REPAIR_ROUNDS: ${V11_MAX_REPAIR_ROUNDS:-1}
      V11_MAX_REPAIRS_PER_CANDIDATE: ${V11_MAX_REPAIRS_PER_CANDIDATE:-2}
    volumes:
      - ./campaign_results/v11:/app/campaign_results/v11
      - ./workspaces/migrationbench_v11:/app/workspaces/migrationbench_v11
      - ./external:/app/external
    working_dir: /app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        ARGS="--subset $${V11_MIGRATION_SUBSET} --out-dir $${V11_OUT_DIR} --workspace-root $${V11_WORKSPACE_ROOT} --migrationbench-root external/MigrationBench --seed $${V11_SEED} --official-timeout-seconds $${V11_OFFICIAL_TIMEOUT_SECONDS} --llm-initial-candidates $${V11_LLM_INITIAL_CANDIDATES} --llm-repair-candidates $${V11_LLM_REPAIR_CANDIDATES} --b6-fallback-policy $${V11_B6_FALLBACK_POLICY} --max-candidates $${V11_MAX_CANDIDATES} --max-repair-rounds $${V11_MAX_REPAIR_ROUNDS} --max-repairs-per-candidate $${V11_MAX_REPAIRS_PER_CANDIDATE}"
        if [ -n "$${V11_MIGRATION_LIMIT}" ]; then
          ARGS="$${ARGS} --limit $${V11_MIGRATION_LIMIT}"
        fi
        if [ "$${V11_OFFICIAL_EVAL}" = "true" ]; then
          ARGS="$${ARGS} --official-eval"
        fi
        if [ "$${V11_USE_LLM_PROVIDERS}" = "true" ]; then
          ARGS="$${ARGS} --use-llm-providers"
        fi
        /opt/venv/bin/python -m scripts.v11.run_v11_migrationbench_campaign $${ARGS}

  # ---- V12.3 MigrationBench targeted agentic comparison (S1/S2/V12) ----
  v12-migrationbench-targeted:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stigmergiagentic-v12-migrationbench-targeted
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: "ignore"
      V12_MIGRATION_SUBSET: ${V12_MIGRATION_SUBSET:-fixtures/migrationbench/subsets/targeted_v12_agentic_5.jsonl}
      V12_MIGRATION_LIMIT: ${V12_MIGRATION_LIMIT:-}
      V12_OUT_DIR: ${V12_OUT_DIR:-campaign_results/v12/migrationbench_targeted_agentic}
      V12_WORKSPACE_ROOT: ${V12_WORKSPACE_ROOT:-workspaces/migrationbench_v12}
      V12_SEED: ${V12_SEED:-42}
      V12_MAX_STEPS: ${V12_MAX_STEPS:-6}
      V12_OFFICIAL_EVAL: ${V12_OFFICIAL_EVAL:-true}
      V12_USE_LLM_PROVIDERS: ${V12_USE_LLM_PROVIDERS:-true}
      V12_OFFICIAL_TIMEOUT_SECONDS: ${V12_OFFICIAL_TIMEOUT_SECONDS:-1800}
      V12_LLM_TIMEOUT_SECONDS: ${V12_LLM_TIMEOUT_SECONDS:-180}
      V12_LLM_MAX_TOKENS: ${V12_LLM_MAX_TOKENS:-3000}
      V12_CLEAN: ${V12_CLEAN:-true}
    volumes:
      - ./campaign_results/v12:/app/campaign_results/v12
      - ./workspaces/migrationbench_v12:/app/workspaces/migrationbench_v12
      - ./external:/app/external
    working_dir: /app
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    command:
      - bash
      - -lc
      - |
        set -e
        if [ ! -d external/MigrationBench/.git ]; then
          mkdir -p external
          git clone --depth 1 https://github.com/amazon-science/MigrationBench.git external/MigrationBench
        fi
        if [ "$${V12_CLEAN}" = "true" ]; then
          rm -rf "$${V12_OUT_DIR}" || true
