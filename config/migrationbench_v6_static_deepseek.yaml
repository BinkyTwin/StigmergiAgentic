agents:
  num_agents: 6
  num_agents_mode: "fixed"
  selection_temperature: 0.12
  local_sensing:
    enabled: true
    intensity_threshold: 0.0
    type_affinity_weight: 0.4
    semantic_affinity_weight: 0.3
    recency_weight: 0.3
    max_candidates: 8
    affinity_exploration_rate: 0.15
  stickiness:
    enabled: true
    recent_progress_window: 3
    continuity_bonus: 0.08
    max_consecutive_reuse: 2
  protocol_compiler:
    enabled: false

skill_library:
  enabled: false
  read_only: true
  db_path: "pheromones/migrationbench_skills_disabled.db"

protocol:
  enabled: false
  read_only: true
  db_path: "pheromones/migrationbench_protocols_disabled.db"

emergence:
  enabled: true
  feedback_loop:
    enabled: false
    interval_ticks: 5
    max_adaptation_delta: 0.0
  cross_run:
    enabled: false
    read_only: true
    max_total_delta: 0.0

orchestrator:
  max_ticks: 80
  idle_cycles_to_stop: 8
  parallel: true
  emergent_resolution:
    enabled: true
    base_probability: 0.1
  recovery_controller:
    enabled: true
    stagnation_ticks: 6
    contention_threshold: 0.6
    recovery_cooldown_ticks: 8
    temperature_boost: 0.1
    temperature_boost_duration: 3
    inhibition_relief: 0.2
    dynamic_idle:
      enabled: true
      node_per_idle_cycle: 4
      max_extra_idle_cycles: 8
  targeted_repair:
    enabled: false
    max_cycles: 1
    repair_marker_intensity: 0.95

llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  temperature: 0.2
  max_context_tokens: 1000000
  max_response_tokens: 384000
  max_tokens_total: 10000000
  max_budget_usd: 0.0
  request_timeout_seconds: 600
  retry_attempts: 3
  estimated_completion_tokens: 24000
  reasoning:
    mode: "non-thinking"

async:
  max_concurrent_llm_calls: 4
  subprocess_timeout: 1800

tools:
  sandbox_root: "."
  allowed_commands:
    - "bash"
    - "git"
    - "mvn"
    - "python"
    - "uv"
  bash_timeout_seconds: 1800
  max_file_size_bytes: 2000000

pressures:
  formula: "aco"
  alpha: 1.0
  beta: 2.0
  default_weights:
    inspect_repository: 1.0
    propose_patch: 1.0
    run_build: 0.7
    finalize_patch: 0.9
    think: 0.25

migrationbench:
  framework: "stigmergic_v6_static"
  seed: 42
  build_command: "mvn clean verify"
  build_timeout_seconds: 1800
  official_root: "external/MigrationBench"
  run_official_eval: true
  official_timeout_seconds: 1800
  official_maven_command: "cd {root_dir}; mvn clean verify"
  query_timeout_seconds: 1800
  workspace_timeout_seconds: 900
  force_workspace: true
  campaign_monitoring:
    mode: "monitor_only"
    manual_abort_supported: true
    record_tokens_runtime_calls_and_cycles: true
