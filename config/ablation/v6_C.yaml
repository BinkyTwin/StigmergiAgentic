# V6-C preset — V6-A + generic targeted repair contract.
framework:
  mode: "travelplanner"

travelplanner:
  database_path: "data/travelplanner/database"
  dataset_split: "validation"
  default_query_idx: 0
  official_full_split_eval: false

agents:
  num_agents: 6
  selection_temperature: 0.1
  memory_capacity: 20
  memory_decay_rate: 0.1
  local_sensing:
    enabled: true
    intensity_threshold: 0.0
    type_affinity_weight: 0.4
    semantic_affinity_weight: 0.3
    recency_weight: 0.3
    max_candidates: 0
    affinity_exploration_rate: 0.2
  stickiness:
    enabled: false
    recent_progress_window: 3
    continuity_bonus: 0.08
    max_consecutive_reuse: 2

orchestrator:
  max_ticks: 80
  idle_cycles_to_stop: 16
  parallel: true
  emergent_resolution:
    enabled: true
    base_probability: 0.1
  recovery_controller:
    enabled: true
    stagnation_ticks: 5
    contention_threshold: 0.6
    recovery_cooldown_ticks: 8
    temperature_boost: 0.1
    temperature_boost_duration: 3
    inhibition_relief: 0.2
    dynamic_idle:
      enabled: true
      node_per_idle_cycle: 6
      max_extra_idle_cycles: 8
  targeted_repair:
    enabled: true
    max_cycles: 2
    repair_marker_intensity: 0.95

llm:
  max_response_tokens: 2048
  reasoning:
    effort: "none"
    exclude: true
  request_timeout_seconds: 120
  retry_attempts: 2

reinforcement:
  enabled: true
  rate: 0.1
  propagation_factor: 0.5
  lesson_threshold: 0.6
  frequentation:
    enabled: true
    read_boost: 0.01
    completion_boost: 0.05
    max_boost_per_tick: 0.1
    diminishing_factor: 0.5

markers:
  decay_type: "exponential"
  decay_rate: 0.05
  default_decay_rate: 0.05
  decay_rates_by_type:
    task: 0.03
    progress: 0.03
    quality: 0.02
    dependency: 0.01
    anticipatory: 0.15
    lesson: 0.01
  inhibition_decay_rate: 0.08
  inhibition_increment: 0.5
  inhibition_threshold: 0.1
  prune_threshold: 0.05
  session_isolation: true
  intensity_clamp: [0.1, 1.0]
  intensity_step_tool: 0.05
  intensity_step_think: 0.1
  intensity_step_decompose: 0.1
  child_intensity_offset: 0.2
  intensity_floor: 0.1
  time_decay:
    enabled: true
    decay_period_seconds: 60.0

pressures:
  formula: "aco"
  alpha: 1.0
  beta: 2.0
  default_weights:
    search_flights: 0.8
    search_hotels: 0.8
    search_restaurants: 0.8
    search_attractions: 0.8
    plan_itinerary: 1.0
    validate_constraints: 0.9
    think: 0.2
    decompose: 0.2

emergence:
  feedback_loop:
    enabled: true
    interval_ticks: 5
    max_adaptation_delta: 0.2
